# PiDog Local Web Console — default configuration
# Override individual values via environment variables, e.g.:
#   PIDOG_WEB_PORT=9000 python3 web_server.py

[server]
host = "0.0.0.0"
port = 8000
log_level = "info"     # critical | error | warning | info | debug

[daemon]
# Unix-socket path of the upstream pidog-control daemon
socket = "~/.openclaw/pidog-control/controller.sock"
# Timeouts (seconds) for daemon round-trips
request_timeout = 5.0
long_timeout    = 15.0

[status]
# How often the WebSocket poller pings the daemon (ms)
ws_push_interval_ms = 1000

[camera]
# Where the upstream picamera2 (or vilib) camera server is reachable.
# `{host}` is substituted by the SPA (direct mode) or by the proxy itself
# (proxy mode — gets replaced with 127.0.0.1 so we never bounce off mDNS).
direct_mjpeg_url = "http://{host}:9000/mjpg"
# Same-origin MJPEG proxy. When true, the SPA loads /api/camera/stream
# from its own origin and the FastAPI server forwards bytes from the
# upstream camera server. Sidesteps cross-port `<img>` quirks and mDNS
# resolution failures on phones. Set false to fall back to direct mode.
proxy_enabled = true

[mdns]
# mDNS hostname advertised by avahi-daemon
hostname = "pidog.local"
# Set false to skip the mDNS probe (LAN IP only)
enabled  = true
