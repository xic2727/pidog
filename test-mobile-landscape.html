<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiDog · 移动端横屏预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0b0d12;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, -apple-system, sans-serif;
    color: #c8d3e8;
    gap: 24px;
    padding: 24px;
  }

  h1 {
    font-size: 14px;
    color: #5a7a9a;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .hint {
    font-size: 12px;
    color: #3a4a5a;
  }

  /* === Phone Frame === */
  .phone-frame {
    width: 700px;
    height: 360px;
    background: #111318;
    border-radius: 28px;
    border: 3px solid #2a3040;
    box-shadow:
      0 0 0 1px #1a2030,
      0 40px 80px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* notch */
  .phone-frame::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 20px;
    background: #111318;
    border-radius: 0 0 14px 14px;
    z-index: 10;
    border-bottom: 2px solid #1e2535;
  }

  /* status bar */
  .status-bar {
    height: 24px;
    background: #0b0d12;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    font-size: 10px;
    color: #6a7a8a;
    flex-shrink: 0;
    margin-top: 20px;
  }

  /* screen = the actual app */
  .screen {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  /* === Replicate the PiDog Console layout === */
  .app {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 140px 1fr 160px;
    grid-template-rows: 1fr auto;
    gap: 0;
    background: #0b0d12;
  }

  /* --- Topbar --- */
  .topbar {
    grid-column: 1 / -1;
    height: 36px;
    background: #0f1117;
    border-bottom: 1px solid #1a2030;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 6px; }
  .logo { font-size: 16px; }
  .title { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #c8d3e8; }
  .title .accent { color: #4a8fff; }
  .conn-badge { display: flex; align-items: center; gap: 4px; font-size: 9px; color: #5a7a9a; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: #4a8fff; }
  .btn-tactical {
    font-size: 9px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid #2a3040;
    background: transparent;
    color: #7a8a9a;
    cursor: default;
  }

  /* --- Col Left: head dpad + move dpad --- */
  .col-left {
    background: #0d0f15;
    border-right: 1px solid #1a2030;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 6px;
    overflow: hidden;
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 2px;
  }
  .panel-tag {
    font-size: 8px;
    background: #1a2840;
    color: #4a8fff;
    padding: 1px 4px;
    border-radius: 2px;
    letter-spacing: 1px;
  }
  .panel-title {
    font-size: 9px;
    color: #5a7a9a;
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 2px;
    width: 90px;
    height: 90px;
    margin: 0 auto;
  }
  .dpad-cell { background: #151922; border-radius: 4px; }
  .dpad-btn {
    background: #1a2030;
    border: 1px solid #252d40;
    border-radius: 4px;
    color: #7a8a9a;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }

  /* --- Col Center: video --- */
  .col-center {
    background: #080a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .video-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #2a3545;
  }
  .video-placeholder .icon { font-size: 28px; opacity: 0.5; }
  .video-placeholder .txt { font-size: 9px; text-align: center; line-height: 1.4; }

  /* HUD overlay */
  .hud-overlay {
    position: absolute;
    left: 0; right: 0;
    display: flex;
    gap: 8px;
    padding: 4px 8px;
  }
  .hud-top { top: 4px; }
  .hud-bottom { bottom: 4px; }
  .hud-chip {
    background: rgba(0,0,0,0.5);
    border: 1px solid #1a2030;
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 8px;
    color: #5a7a9a;
  }
  .hud-chip b { color: #7a8a9a; }

  /* --- Col Right: actions + poses --- */
  .col-right {
    background: #0d0f15;
    border-left: 1px solid #1a2030;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 6px;
    overflow: hidden;
  }

  .square-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    flex: 1;
  }
  .sq {
    background: #1a2030;
    border: 1px solid #252d40;
    border-radius: 4px;
    color: #7a8a9a;
    font-size: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    text-align: center;
    padding: 2px;
    line-height: 1.2;
  }
  .sq[data-sound] {
    background: #1a2a1a;
    border-color: #2a4a2a;
    color: #5a9a5a;
  }
  .sq[data-sound]:before { content: '🔊 '; font-size: 7px; }

  .round-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
  }
  .rd {
    background: #1a2030;
    border: 1px solid #252d40;
    border-radius: 50%;
    color: #7a8a9a;
    font-size: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    aspect-ratio: 1;
  }

  /* --- Bottom bar --- */
  .bottombar {
    grid-column: 1 / -1;
    height: 28px;
    background: #0f1117;
    border-top: 1px solid #1a2030;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    flex-shrink: 0;
  }
  .bb-left { display: flex; align-items: center; gap: 8px; }
  .pill { font-size: 8px; padding: 2px 6px; border-radius: 8px; background: #1a2030; color: #4a5a6a; }
  .muted { font-size: 9px; color: #3a4a5a; }
  .switch {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 8px;
    color: #4a5a6a;
    cursor: default;
  }
  .switch-track {
    width: 26px;
    height: 14px;
    background: #1a2030;
    border-radius: 7px;
    border: 1px solid #252d40;
    position: relative;
  }
  .switch-thumb {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #3a4a5a;
    border-radius: 50%;
    top: 1px;
    left: 1px;
  }

  /* home indicator */
  .home-indicator {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 4px;
    background: #2a3040;
    border-radius: 2px;
  }
</style>
</head>
<body>

<h1>PiDog · 移动端横屏预览</h1>
<p class="hint">实际效果请在手机浏览器打开 http://pidog.local:8000</p>

<div class="phone-frame">
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 📡 🔋 80%</span>
  </div>
  <div class="screen">
    <div class="app">
      <!-- Topbar -->
      <header class="topbar">
        <div class="brand">
          <span class="logo">🐶</span>
          <span class="title">PIDOG<span class="accent">.OS</span></span>
        </div>
        <div class="conn-badge">
          <span class="dot"></span>
          <span>在线</span>
        </div>
      </header>

      <!-- Left col -->
      <section class="col-left">
        <div class="panel-header">
          <span class="panel-tag">CAM</span>
          <span class="panel-title">云台视角</span>
        </div>
        <div class="dpad">
          <div class="dpad-cell"></div>
          <div class="dpad-btn">▲</div>
          <div class="dpad-cell"></div>
          <div class="dpad-btn">◀</div>
          <div class="dpad-btn" style="font-size:8px;color:#4a8fff">⌂</div>
          <div class="dpad-btn">▶</div>
          <div class="dpad-cell"></div>
          <div class="dpad-btn">▼</div>
          <div class="dpad-cell"></div>
        </div>

        <div class="panel-header">
          <span class="panel-tag">NAV</span>
          <span class="panel-title">行进导航</span>
        </div>
        <div class="dpad" style="width:80px;height:80px">
          <div class="dpad-cell"></div>
          <div class="dpad-btn">▲</div>
          <div class="dpad-cell"></div>
          <div class="dpad-btn">◀</div>
          <div class="dpad-cell" style="background:#1a2840"></div>
          <div class="dpad-btn">▶</div>
          <div class="dpad-cell"></div>
          <div class="dpad-btn">▼</div>
          <div class="dpad-cell"></div>
        </div>
      </section>

      <!-- Center col -->
      <section class="col-center">
        <div class="hud-overlay hud-top">
          <div class="hud-chip">姿态: <b>直立</b></div>
          <div class="hud-chip">视角: <b>0° / 0°</b></div>
        </div>
        <div class="video-placeholder">
          <div class="icon">📡</div>
          <div class="txt">视频流预览区<br><small style="color:#2a3545">vilib MJPEG → :9000</small></div>
        </div>
        <div class="hud-overlay hud-bottom">
          <div class="hud-chip">灯效: <b>off</b></div>
          <div class="hud-chip">帧数: <b>0</b></div>
        </div>
      </section>

      <!-- Right col -->
      <section class="col-right">
        <div class="panel-header">
          <span class="panel-tag">ACT</span>
          <span class="panel-title">互动表达</span>
        </div>
        <div class="square-grid">
          <div class="sq">摇尾</div>
          <div class="sq">吠叫</div>
          <div class="sq">喘气</div>
          <div class="sq">伸懒腰</div>
          <div class="sq">握手</div>
          <div class="sq">击掌</div>
          <div class="sq">俯卧撑</div>
          <div class="sq">挠痒</div>
          <div class="sq">嚎叫</div>
          <div class="sq" data-sound="birthday_song">生日歌</div>
          <div class="sq" data-sound="birthday_greeting">生日祝福</div>
        </div>

        <div class="panel-header" style="margin-top:4px">
          <span class="panel-tag">POSE</span>
          <span class="panel-title">基础姿态</span>
        </div>
        <div class="round-grid">
          <div class="rd">站立</div>
          <div class="rd">坐下</div>
          <div class="rd">趴下</div>
          <div class="rd">扭动</div>
        </div>
      </section>

      <!-- Bottombar -->
      <footer class="bottombar">
        <div class="bb-left">
          <span class="pill">VOICE OFF</span>
          <span class="muted">系统就绪</span>
        </div>
        <label class="switch">
          <span>语音助手模式</span>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </label>
      </footer>
    </div><!-- .app -->
  </div><!-- .screen -->
  <div class="home-indicator"></div>
</div><!-- .phone-frame -->

</body>
</html>
